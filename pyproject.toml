[project]
name = "spg"
version = "0.1.0"
description = "Personal developer tools — a single uv project, one tool per directory under tools/."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=13.7",
]

# One entry point per tool. Each maps to a package under tools/.
[project.scripts]
pr-watch = "tools.pr_watch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

# Dev tooling shared by every tool (PEP 735 dependency groups).
# `uv sync` installs this group by default.
[dependency-groups]
dev = [
    "pytest>=8.2",
    "ty>=0.0.29",
    "pre-commit>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ty.environment]
python-version = "3.13"
