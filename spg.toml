# spg.toml — the tool registry for this repo.
#
# One catalog entry per tool, pointing at where it lives and how it runs.
# This is deliberately separate from pyproject.toml: pyproject owns
# *packaging* (deps, build, entry points, tool config); spg.toml owns the
# *catalog* — a single place that answers "what tools are in here, where do
# they live, and how do I invoke each one?".
#
# Invariant: every [[tool]] here has a matching `[project.scripts]` entry in
# pyproject.toml and a `just <recipe>` recipe in the justfile.

[project]
name = "dev-tools"
description = "Personal developer tools — one uv project, one tool per directory under tools/."
tools_dir = "tools"

[[tool]]
name = "pr-watch"
package = "tools.pr_watch"
entry = "tools.pr_watch.cli:main"
recipe = "pr-watch"
description = "Live, auto-refreshing Rich TUI of the current branch's GitHub PR: check statuses and unresolved review threads. Uses the gh CLI for auth."
