[project]
name = "dev-tools"
version = "0.1.0"
description = "Personal developer tools — a single uv project, one tool per directory under tools/."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rich>=13.7",
    "textual>=8.2.8",
]

# One entry point per tool. Each maps to a package under tools/.
[project.scripts]
airflow-watch = "tools.airflow_watch.cli:main"
azdo-watch = "tools.azdo_watch.cli:main"
my-issues = "tools.my_issues.cli:main"
my-prs = "tools.my_prs.cli:main"
pr-watch = "tools.pr_watch.cli:main"
slack-me = "tools.slack_me.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

# Dev tooling shared by every tool (PEP 735 dependency groups).
# `uv sync` installs this group by default.
[dependency-groups]
dev = [
    "pytest>=8.2",
    "ty>=0.0.29",
    "pre-commit>=3.8",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.ty.environment]
python-version = "3.13"
