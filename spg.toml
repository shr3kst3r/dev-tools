# spg.toml — publishes this repo's tools as commands on your $PATH.
#
# `spg` (https://github.com/… / ~/goblin/spg) reads this file and, on
# `spg install`, writes a `~/bin/<name>` wrapper for each [commands.*] entry
# plus zsh tab completion driven by the declared args. It is unrelated to
# packaging: pyproject.toml owns deps/build/entry points; this file only says
# "which of those tools should be on my machine as a command, and how do they
# complete?".
#
# Each wrapper cd's into the repo root and runs the command, so `uv run` picks
# up this project's venv regardless of where you invoke it from.

[project]
name = "dev-tools"

[commands.airflow-watch]
run = "uv run airflow-watch"
description = "Live Textual dashboard of an Astro Airflow deployment: failing DAG runs, task instances in dependency order, and their logs — all searchable with `/`. Airflow 2 only. Uses the astro CLI for auth."
args = [
    { name = "--deployment", description = "Astro deployment name or id to watch (default: last used)" },
    { name = "--interval", description = "seconds between refreshes (default: 60, minimum 15)" },
    { name = "--limit", description = "maximum DAG runs to show (default: 50; paged above 100)" },
    { name = "--state", description = "only show runs in this state; repeatable" },
    { name = "--view", description = "which list --once prints: runs or dags" },
    { name = "--api-url", description = "base URL of a plain (non-Astro) Airflow to watch instead" },
    { name = "--airflow-version", description = "Airflow version of the --api-url target" },
    { name = "--once", description = "render a single snapshot and exit" },
]

[commands.my-prs]
run = "uv run my-prs"
description = "Live Textual dashboard of your open GitHub PRs from the last 2 weeks, across all repos: failing checks, unresolved comments, missing reviews. Uses the gh CLI for auth."
args = [
    { name = "--days", description = "how far back to look for PR activity (default: 14)" },
    { name = "--interval", description = "seconds between refreshes (default: 60)" },
    { name = "--limit", description = "maximum PRs to show (default: 50)" },
    { name = "--author", description = "GitHub login to search PRs for (default: you)" },
    { name = "--once", description = "render a single snapshot and exit" },
]

[commands.pr-watch]
run = "uv run pr-watch"
description = "Live, auto-refreshing Rich TUI of a repo's current-branch GitHub PR: statuses and unresolved review threads. Uses the gh CLI for auth."
args = [
    { name = "directory", description = "repo directory to watch (default: current dir)", type = "directories" },
    { name = "--interval", description = "seconds between refreshes (default: 30)" },
    { name = "--once", description = "render a single snapshot and exit" },
]

[commands.slack-me]
run = "uv run slack-me"
description = "Send yourself a Slack message via a webhook configured in ~/.slack-me.toml. Message comes from args or stdin: `slack-me \"done\"` or `long-job | slack-me`."
args = [
    { name = "message", description = "the message to send (default: read from stdin)" },
    { name = "--quiet", description = "send silently, no confirmation output" },
]

# --- links: publish this repo's skills and agents to Claude Code --------------
#
# `spg install` / `sync` creates these symlinks (and `uninstall` removes them),
# so the skills work in every session rather than only when the shell is inside
# this repo. `source` is repo-relative and points at the real top-level file —
# never at the `.claude/` bridge symlink, so nothing resolves through two hops.
#
# A `target` ending in `/` links *into* that directory using the table name as
# the leaf. The agents need the explicit form instead, because Claude Code only
# reads `.md` files out of an agents directory and the table name carries no
# extension.

[links.slack-me]
source = "skills/slack-me"
target = "~/.claude/skills/"
description = "slack-me skill: ping yourself on Slack, plus the Slack mrkdwn reference"

[links.adr-rpi]
source = "skills/adr-rpi"
target = "~/.claude/skills/"
description = "adr-rpi skill: Research → Plan → Implement with ADRs as the durable memory layer"

[links.adr-format]
source = "skills/adr-format"
target = "~/.claude/skills/"
description = "adr-format skill: ADR format spec + significance bar, preloaded into the adr-rpi subagents"

[links.adr-implementer]
source = "agents/adr-implementer.md"
target = "~/.claude/agents/adr-implementer.md"
description = "adr-rpi implement phase subagent (Opus) — adr-rpi cannot run its implement phase without it"

[links.adr-reviewer]
source = "agents/adr-reviewer.md"
target = "~/.claude/agents/adr-reviewer.md"
description = "adr-rpi review phase subagent (Opus, xhigh effort) — adr-rpi cannot run its review phase without it"
