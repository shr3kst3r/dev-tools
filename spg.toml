# spg.toml — publishes this repo's tools as commands on your $PATH.
#
# `spg` (https://github.com/… / ~/goblin/spg) reads this file and, on
# `spg install`, writes a `~/bin/<name>` wrapper for each [commands.*] entry
# plus zsh tab completion driven by the declared args. It is unrelated to
# packaging: pyproject.toml owns deps/build/entry points; this file only says
# "which of those tools should be on my machine as a command, and how do they
# complete?".
#
# Each wrapper cd's into the repo root and runs the command, so `uv run` picks
# up this project's venv regardless of where you invoke it from.

[project]
name = "dev-tools"

[commands.my-prs]
run = "uv run my-prs"
description = "Live Textual dashboard of your open GitHub PRs from the last 2 weeks, across all repos: failing checks, unresolved comments, missing reviews. Uses the gh CLI for auth."
args = [
    { name = "--days", description = "how far back to look for PR activity (default: 14)" },
    { name = "--interval", description = "seconds between refreshes (default: 60)" },
    { name = "--limit", description = "maximum PRs to show (default: 50)" },
    { name = "--author", description = "GitHub login to search PRs for (default: you)" },
    { name = "--once", description = "render a single snapshot and exit" },
]

[commands.pr-watch]
run = "uv run pr-watch"
description = "Live, auto-refreshing Rich TUI of a repo's current-branch GitHub PR: statuses and unresolved review threads. Uses the gh CLI for auth."
args = [
    { name = "directory", description = "repo directory to watch (default: current dir)", type = "directories" },
    { name = "--interval", description = "seconds between refreshes (default: 30)" },
    { name = "--once", description = "render a single snapshot and exit" },
]

[commands.slack-me]
run = "uv run slack-me"
description = "Send yourself a Slack message via a webhook configured in ~/.slack-me.toml. Message comes from args or stdin: `slack-me \"done\"` or `long-job | slack-me`."
args = [
    { name = "message", description = "the message to send (default: read from stdin)" },
    { name = "--quiet", description = "send silently, no confirmation output" },
]
