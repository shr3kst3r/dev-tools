# tmux.conf — published to ~/.tmux.conf by `spg install` (see spg.toml).
#
# Plugins are managed by tpm, which is *not* vendored here: bootstrap it once
# with
#
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# then hit `prefix + I` inside tmux to install everything declared below.
# Without tpm the `run` line at the bottom is a no-op and every plain tmux
# setting in this file still applies.

# --- prefix ------------------------------------------------------------------

# C-a instead of the default C-b: closer to the home row, and the muscle memory
# carries over from screen.
set -g prefix C-a
unbind C-b
# prefix + a sends a literal C-a through to whatever is running in the pane
# (nested tmux, readline's beginning-of-line, …).
bind -T prefix a send-prefix

# reload this file in place
unbind r
bind r source-file ~/.tmux.conf

# prefix + Tab cycles panes — the reason extrakto is remapped off Tab below.
bind -T prefix Tab select-pane -t :.+

set-option -g history-limit 50000
set-option -g allow-rename off

# --- copy mode and the clipboard ---------------------------------------------

# vi keys in copy mode, with v/y selecting and yanking like vim.
# macOS pipes to pbcopy; on Linux tmux-yank (below) covers the equivalent, or
# swap the two pipe commands for xclip.
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
# let programs (and copy-mode) set the system clipboard via OSC 52 — this is
# what makes yanking work over ssh
set -g set-clipboard on

# type once into every pane of the window
bind e setw synchronize-panes

# --- terminal ----------------------------------------------------------------

set -g default-terminal "xterm-256color"
# 24-bit true color (modern Neovim / themes)
set -as terminal-features ",xterm-256color:RGB"

# --- quality-of-life ---------------------------------------------------------

set -g mouse on                 # click panes/windows, drag borders, natural scroll
set -g base-index 1             # windows start at 1 (matches the 1-9 jump keys)
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on      # close a window -> renumber the rest
set -sg escape-time 10          # kill Esc lag in Vim
set -g focus-events on          # let Vim/Neovim see focus in/out

# drag window names on the status bar to reorder
# (explicit -s needed: in a mouse binding the implied source ALSO resolves to
# the mouse window, so the classic `swap-window -d -t=` self-swaps and no-ops)
bind -n MouseDrag1Status run-shell 'if [ "#{active_window_index}" != "#{window_index}" ]; then tmux swap-window -d -s "#{session_name}:#{active_window_index}" -t "#{session_name}:#{window_index}"; fi'

# splits that keep the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- status bar colors -------------------------------------------------------

# top row: a hint of dark blue (bottom row is reset to terminal default below)
set -g status-style 'bg=#0f1320,fg=colour250'
set -g status-left-style 'fg=green,bold'
set -g status-right-style 'fg=default'
# inactive windows dimmed, active window bright + bold (gray reads on light or dark)
set -g window-status-style 'fg=colour245'
set -g window-status-current-style 'fg=colour208,bold'
set -g window-status-activity-style 'fg=yellow'
# subtle pane borders, green on the active pane
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=green'
# messages + copy-mode selection
set -g message-style 'bg=default,fg=green'
set -g mode-style 'bg=green,fg=black'

# --- two-line status bar -----------------------------------------------------

set -g status 2
# row 1: session name + window list only (title and clock move to row 2)
set -g status-right ''
# row 2: active pane's full title (no 21-char truncation), clock on the right
set -g status-format[1] '#[fill=default,bg=default,fg=brightwhite,bold]#[align=left] #{pane_title}#[align=right]%H:%M %d-%b-%y '

# --- plugins -----------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
# sane defaults that nobody argues with
set -g @plugin 'tmux-plugins/tmux-sensible'
# cross-platform copy to the system clipboard
set -g @plugin 'tmux-plugins/tmux-yank'
# session persistence: prefix+C-s save, prefix+C-r restore; continuum autosaves
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
# prefix+C-e: fzf-pick any token from screen/scrollback, insert or copy
# (extrakto defaults to prefix+Tab, which we use for pane cycling)
set -g @plugin 'laktak/extrakto'
set -g @extrakto_key 'C-e'
# prefix+u: fzf-pick a URL on screen and open it
set -g @plugin 'wfxr/tmux-fzf-url'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf).
# Guarded, because tpm is cloned by hand rather than published with this file:
# unguarded, a machine without it greets you with a "No such file or directory"
# on every tmux start and every `prefix + r`.
if-shell '[ -x ~/.tmux/plugins/tpm/tpm ]' "run '~/.tmux/plugins/tpm/tpm'"
